name: ci

# Vérifications sans réseau ni secret : type-check du Worker, tests unitaires du
# détecteur de veille, garde anti-dérive de la documentation, comportement du JS client
# de la page publique, ordre de laws.config.json (invariant 1) et reconstructibilité
# d'une D1 vierge.
#
# Les tests Python du PARSEUR (test_ccq_fr, test_corpus) téléchargent les EPUB : ils
# tournent en local, pas ici. Mais test_config.py, lui, ne fait AUCUN appel réseau — il
# lit laws.config.json sur disque. Il était exclu par ricochet, ce qui laissait
# l'invariant le plus destructeur du dépôt sans aucun garde : une PR qui réordonne
# laws.config.json décalait toutes les plages d'id et passait la CI au vert.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx wrangler types # génère worker-configuration.d.ts (pas d'auth requise)
      - run: npx tsc --noEmit
      - run: node --test scripts/check-consolidation.test.mjs
      - run: node --test tests/catalogue.test.mjs # garde anti-dérive de la documentation (R10)
      - run: node --test tests/page-client.test.mjs # comportement du JS client de la page
      - run: node --test tests/ranges.test.mjs # mode plage : sort_key n'est pas un ordre total
      - run: node --test tests/paths.test.mjs # deux familles de chemins, un seul decoupeur
      - run: node --test tests/federal-switch.test.mjs # FEDERAL_CORPUS : aucune lecture du corpus non masquee

      # INVARIANT 1 : l'ordre de laws.config.json porte les plages d'id. Le réordonner
      # fait écraser les articles d'autres lois à la prochaine ingestion, EN SILENCE.
      # test_config.py (test_ordre_fige, test_plages_id_disjointes) ne fait aucun appel
      # réseau : il a sa place ici, contrairement aux tests du parseur.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # beautifulsoup4 seulement : test_config n'en a pas besoin lui-même, mais il importe
      # pipeline.ingest pour _id_base, et ingest importe le parseur. lxml est OPTIONNEL
      # (BeautifulSoup retombe sur html.parser), donc écarté ici — rien ne parse en CI.
      - run: pip install "beautifulsoup4>=4.13"
      - run: python -m unittest pipeline.tests.test_config -v

      # Le validateur de la couche de curation (phase 3) : il REFUSE de charger un lien ou
      # un concept dont la cible ne résout pas. `pipeline/discovery/` n'avait aucun test —
      # la porte anti-données-fausses n'était elle-même gardée par rien. Fausse base en
      # mémoire : ni réseau, ni wrangler, ni D1.
      - run: python -m unittest pipeline.tests.test_curation -v

      # PORTE DE LA PHASE 0 du corpus fédéral : le classement des balises LIMS est une
      # liste BLANCHE. Une balise absente du classement doit ARRÊTER l'ingestion, pas
      # être traversée en silence. Ce test verrouille les propriétés du classement ;
      # la correspondance avec les fichiers réels exige le clone, donc du réseau, et
      # reste la porte manuelle (pipeline.discovery.recon_lims).
      - run: python -m unittest pipeline.tests.test_lims_tags -v
      # Miroir du decoupeur de chemins : meme colonne `divisions.path` des deux cotes.
      # Une divergence est du meme ordre que celle de sort_key <-> sortKeyOf (invariant 2),
      # qui avait vide silencieusement le mode plage de 36 lois sur 38.
      - run: python -m unittest pipeline.tests.test_paths -v

      # Temoins de recette du parseur LIMS. Contrairement aux tests du parseur EPUB
      # (test_ccq_fr, test_corpus) qui telechargent, ceux-ci lisent des fixtures
      # VERSIONNEES et figees par SHA : ils tournent donc en CI. Le temoin principal
      # est l'art. 2 de la L.F.I. et ses 51 blocs Definition — 99,6 % de l'article
      # serait perdu si le walker ne les descendait pas.
      - run: python -m unittest pipeline.tests.test_parser_lims -v
      # Le SQL genere par load.py, lu comme du texte : colonnes de 0004, couple
      # staging/bascule d'article_numbers, et l'invariant 3 sur la PAIRE de citations
      # (une passe EN ecrasait official_cite, la forme francaise).
      - run: python -m unittest pipeline.tests.test_load_federal -v

      # Reconstructibilité : schema.sql décrit l'ÉTAT INITIAL, les migrations s'appliquent
      # PAR-DESSUS. Sans ce garde, un DROP COLUMN sans garde dans une migration casse le
      # bootstrap d'une base neuve sans que rien ne le signale — c'est arrivé avec 0002,
      # découvert seulement à l'audit. Le harnais d'éval ne teste que contre une base déjà
      # peuplée ; ceci est le seul contrôle qui parte du vide. Local, sans réseau ni secret.
      - name: Bootstrap d'une D1 vierge (schema.sql + migrations)
        run: |
          set -euo pipefail
          T=$(mktemp -d)
          npx wrangler d1 execute qclaw --local --persist-to "$T" --file=./schema.sql -y
          npx wrangler d1 migrations apply qclaw --local --persist-to "$T"
          for t in search_log division_links concept_gazetteer article_headnotes; do
            npx wrangler d1 execute qclaw --local --persist-to "$T" --json \
              --command "SELECT COUNT(*) AS n FROM pragma_table_info('$t')" \
              | grep -q '"n": *[1-9]' || { echo "$t absente après migrations"; exit 1; }
          done
          # Le drapeau validated est la frontière entre du contenu proposé par un modèle et
          # du droit relu par un avocat. Une colonne perdue ou renommée le ferait tomber en
          # silence : les requêtes filtrent dessus, elles ne le déclarent pas.
          for t in division_links concept_gazetteer article_headnotes; do
            npx wrangler d1 execute qclaw --local --persist-to "$T" --json \
              --command "SELECT COUNT(*) AS n FROM pragma_table_info('$t') WHERE name='validated'" \
              | grep -q '"n": *1' || { echo "$t sans colonne validated"; exit 1; }
          done
          # 0004 : le RENOMMAGE doit avoir pris effet, DANS LES DEUX SENS. Le garde du
          # bootstrap attrape le cas naif — schema.sql declarant deja official_cite ferait
          # echouer le RENAME. Il laisserait passer l'INVERSE, qui est le vrai danger :
          # renommer dans schema.sql ET retirer l'ALTER de 0004 laisse cette CI VERTE et la
          # production avec l'ancienne colonne. L'assertion NEGATIVE est celle qui compte.
          npx wrangler d1 execute qclaw --local --persist-to "$T" --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('laws') WHERE name='official_cite'" \
            | grep -q '"n": *1' || { echo "laws.official_cite absente apres 0004"; exit 1; }
          npx wrangler d1 execute qclaw --local --persist-to "$T" --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('laws') WHERE name='rlrq_cite'" \
            | grep -q '"n": *0' || { echo "laws.rlrq_cite SUBSISTE : 0004 n a pas renomme"; exit 1; }
          npx wrangler d1 execute qclaw --local --persist-to "$T" --json \
            --command "SELECT COUNT(*) AS n FROM pragma_table_info('article_numbers')" \
            | grep -q '"n": *4' || { echo "article_numbers absente ou incomplete"; exit 1; }
          # `text` EN POSITION 0 : src/lib.ts code en dur snippet(articles_fts, 0, ...), donc
          # une inversion ferait rendre une NOTE MARGINALE comme extrait du texte officiel —
          # or l art. 14 de la Loi d interpretation dit qu elle n en fait pas partie (R4).
          npx wrangler d1 execute qclaw --local --persist-to "$T" --json \
            --command "SELECT name AS n FROM pragma_table_info('articles_fts') WHERE cid=0" \
            | grep -q '"n": *"text"' || { echo "articles_fts : text pas en position 0"; exit 1; }
          rm -rf "$T"
