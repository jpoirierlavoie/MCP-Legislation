# OSV-Scanner configuration — https://google.github.io/osv-scanner/configuration/
#
# Règles du dépôt :
#   1. Chaque exemption utilise l'identifiant GHSA exact utilisé par l'OSV (jamais un alias CVE,
#      car `osv-scanner` échoue sur une exemption inutilisée), avec le MOTIF et la DATE.
#   2. `osv-scanner` sort en code 1 dès qu'une vulnérabilité existe ; le verdict bloquant appartient
#      à l'étape « Verdict » de `.github/workflows/osv-scanner.yml` qui inspecte le SARIF filtré,
#      ainsi qu'à `scripts/verifier-audit.mjs` (`npm run audit`).
#   3. Retirer toute exemption dès qu'un correctif amont est publié (un identifiant inutilisé fait
#      échouer `osv-scanner` et `npm run audit`).

